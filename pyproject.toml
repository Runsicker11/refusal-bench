[project]
name = "refusal-bench"
version = "0.0.1"
description = "An eval harness for AI analysts that measures what they refuse to answer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refusal_bench", "warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
